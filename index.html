<!DOCTYPE HTML/>
<html>
    <head>
        <title>Test Board</title>
        <script src="./index.js"></script>
        <script>
            function onStart() {
                if (DeviceOrientationEvent.requestPermission){ DeviceOrientationEvent.requestPermission(); }
                window.addEventListener(
                    "deviceorientation",
                    moveHandler,
                    true
                );
            }

            function moveHandler(e) {
                const t = document.getElementById("infos");
                t.innerText = `
                abs: ${e.absolute}
                dx: ${e.alpha}
                dy: ${e.beta}
                dz: ${e.gamma}
                `
                console.log(e);
            }

            onStart();
        </script>
    </head>
    <body>
        <p id="infos"></p>
    </body>
</html>
